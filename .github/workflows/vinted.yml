name: Vinted monitor

on:
  schedule:
    - cron: "7-59/10 * * * *"   # ogni 10 minuti (UTC; GitHub può ritardare di qualche minuto)
  workflow_dispatch:          # permette di lanciarlo a mano dalla scheda Actions

permissions:
  contents: write             # serve per salvare vinted_seen.json nel repository

concurrency:
  group: vinted-monitor       # evita due esecuzioni sovrapposte
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Controllo Vinted
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python vinted_monitor.py

      - name: Salva gli annunci già visti
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vinted_seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna annunci visti"
          git pull --rebase -X theirs || true
          git push
